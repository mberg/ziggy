# Copy to devices/<kid>.toml and edit.
device_name = "Ziggy"
state_dir = "/var/lib/ziggy"
# Plays through the headphone jack, or a Bluetooth speaker paired in Settings:
# bluetooth_speaker = "AA:BB:CC:DD:EE:FF"
initial_volume = 60
# The Spotify Soloist API key (from the Spotify for Developers dashboard) is read from
# <state_dir>/soloist-api-key unless this says otherwise:
# soloist_api_key_file = "/var/lib/ziggy/soloist-api-key"
dim_after_secs = 180
off_after_secs = 600
# Audiobooks from an Audiobookshelf server turns Books on. Sign in from Settings on the player.
# audiobookshelf_url = "http://nas.local:13378"
# Voice control: say the wake word, then a request. Needs a USB microphone and the keyword model:
#   curl -sSL https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2 | tar xj -C /var/lib/ziggy
# voice_model_dir = "/var/lib/ziggy/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
# gemini_api_key = "…"            # or GEMINI_API_KEY in the environment
# vertex_key_file = "/var/lib/ziggy/vertex-key.json"  # Google Cloud service account: uses Vertex AI and Cloud credits instead
# vertex_location = "global"
# wake_phrase = "ziggy"           # "hey ziggy" wakes more readily but also on "hey music"
# wake_threshold = 0.25           # lower wakes more readily
# microphone = "USB"              # part of the microphone's name; the default input otherwise
# gemini_model = "gemini-3.5-flash-lite"
