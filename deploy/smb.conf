# Ziggy: shares the music folder as "Music". Written by `ziggy setup` and `ziggy update`.
# The player starts smbd only while Settings → My music → Shared folder is on.
[global]
   server role = standalone server
   server string = Ziggy
   server min protocol = SMB2
   map to guest = Bad User
   # Found by Bonjour (Finder's Network list), not by old Windows network browsing.
   multicast dns register = yes
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   usershare max shares = 0
   logging = systemd
   log level = 0

[Music]
   path = /var/lib/ziggy-music
   read only = no
   browseable = yes
   guest ok = yes
   force user = ziggy-player
   force group = ziggy-music
   create mask = 0664
   directory mask = 2775
