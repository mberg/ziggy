[package]
name = "ziggy-player"
version.workspace = true
edition.workspace = true

[dependencies]
# Play history on the device; bundled so the Pi build needs no system SQLite.
rusqlite = { version = "0.37", features = ["bundled"] }
# Sonos control over the home network (UPnP), and its event subscriptions.
sonor = "2"
rupnp = "2"
roxmltree = "0.18"
futures-util = "0.3"
anyhow = "1"
base64 = "0.22"
# Voice: the microphone, and the wake word on the device.
cpal = "0.16"
sherpa-onnx = "1.13.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio-tungstenite = "0.28"
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"
slint = { version = "1.18", default-features = false, features = ["backend-linuxkms-noseat"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"
# Headless Slint for tests that click through the real UI.
i-slint-backend-testing = "=1.18.1"
